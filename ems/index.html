<style>
body{margin:0;background:#f3f1ec;font-variant-numeric:tabular-nums}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .ct{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
h2.ct{font-weight:600}
a{color:#340006}a:hover{color:#4f0b22}
button{font:inherit;cursor:pointer}
input{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #50bdb1;outline-offset:2px}
.card{background:#fff;border:1px solid #e4e0d8;border-radius:12px;padding:20px 22px;min-width:0;box-sizing:border-box}
.ct{margin:0;font-size:16px;font-weight:700}
.cs{margin:4px 0 14px;font-size:12px;color:#6f5f66;line-height:1.7}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3,.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.k8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.fill{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.card{display:flex;flex-direction:column}
.wrapv{padding:24px 28px 100px;max-width:1560px;width:100%;box-sizing:border-box;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1280px){.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.k8{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1150px){.g3,.k3{grid-template-columns:repeat(2,minmax(0,1fr))}.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.k3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.k6,.k8{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mk{background:#fff;border:1px solid #e4e0d8;border-radius:12px;padding:15px 17px}
.mk .l{font-size:12px;color:#6f5f66;font-weight:600}
.mk .v{font:800 26px Inter,sans-serif;margin-top:8px;letter-spacing:-.6px}
.mk .s{font-size:11px;color:#6f5f66;margin-top:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,0,6,.45)}70%{box-shadow:0 0 0 14px rgba(52,0,6,0)}100%{box-shadow:0 0 0 0 rgba(52,0,6,0)}}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(.5);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(var(--sx,-16px))}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes cell{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.fu{animation:fadeUp .3s ease-out both}
.d1,.d2,.d3,.d4,.d5,.d6{animation-delay:0s}
.lift{transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.lift:hover{border-color:#c9c1b2}
.navbtn{transition:background .2s,color .2s}
.navbtn:hover{background:rgba(255,255,255,.08)}
.chip{transition:background .2s,border-color .2s,transform .15s}
.chip:hover{border-color:#ecc3d1}
.line{stroke-dasharray:1600;animation:draw 1.8s cubic-bezier(.3,.6,.2,1) .2s both}
.area{animation:areaIn 1.2s ease .6s both}
.bar{transition:width .6s ease-out,flex-basis .6s ease-out}
.domgrid>*{flex:1 1 132px;min-width:0}
.ring{transition:stroke-dasharray 1.4s cubic-bezier(.2,.7,.2,1)}
.fab{}
.live{animation:livedot 1.4s infinite}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#340006;animation:dot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.caret{display:inline-block;width:2px;height:1em;background:#ff6fb5;vertical-align:-2px;margin-inline-start:2px;animation:caret 1s infinite}
.panel{animation:popIn .35s cubic-bezier(.2,.7,.2,1) both}
.feedNew{animation:slideIn .6s cubic-bezier(.2,.7,.2,1) both}
[dir=rtl] .feedNew{--sx:16px}
.step{animation:fadeUp .45s ease both}
.col{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.hc{animation:cell .45s cubic-bezier(.2,.7,.2,1) both}
.vsq{animation:pop .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .15s}
.vsq:hover{transform:scale(1.25)}
.stn{position:absolute;cursor:pointer;animation:pop .55s cubic-bezier(.2,.7,.2,1) both}.stn:hover span{transform:scale(1.35)}
.pingc{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #e5484d;animation:ping 1.8s ease-out infinite}
.route{stroke-dasharray:6 6;animation:dash 1s linear infinite}
.covr{transform-box:fill-box;transform-origin:center;animation:scaleIn 1s cubic-bezier(.2,.7,.2,1) both}
.sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(249,20,149,.35),transparent);animation:sweep 1.6s linear infinite}
.toastm{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);animation:toast .35s ease both;z-index:70}
@keyframes drawerIn{from{transform:translateX(var(--dx,100%))}to{transform:none}}
.drawer{animation:drawerIn .35s cubic-bezier(.2,.7,.2,1) both}
[dir=rtl] .drawer{--dx:-100%}
.vsq{border:0;padding:0;cursor:pointer}
.why{border:0;background:transparent;padding:1px 4px;margin:-1px -4px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px;text-decoration-thickness:1.5px}
.why:hover:not(:disabled){background:#fbeee2}
.why:disabled{text-decoration:none;cursor:default}
.live{animation:none}
.feedNew{animation:none}
@media (max-width:900px){
  nav.side{position:fixed !important;top:0;bottom:0;inset-inline-start:0;width:min(300px,86vw) !important;flex:none !important;padding:22px 14px !important;overflow-y:auto;z-index:80;transform:translateX(105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  [dir=ltr] nav.side{transform:translateX(-105%)}
  nav.side.open{transform:none !important}
  .hdr{padding:10px 14px !important}
  .hdr-lbl{display:none}
  .wrapv{padding:16px 14px 90px !important}
  .side-only{display:none}
}
.mob-only{display:none}
@media (max-width:900px){.mob-only{display:block}}

.card{border-color:transparent;box-shadow:0 1px 2px rgba(61,16,31,.05),0 6px 18px rgba(61,16,31,.04)}
.mk{border-color:transparent;box-shadow:0 1px 2px rgba(61,16,31,.05),0 6px 18px rgba(61,16,31,.04)}
@media (hover:hover){.card .cs{opacity:.55;transition:opacity .2s}.card:hover .cs,.card:focus-within .cs{opacity:1}}
@keyframes fadeUp2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp2 .45s cubic-bezier(.2,.7,.2,1) both}
.d2{animation-delay:.04s}.d3{animation-delay:.08s}.d4{animation-delay:.12s}.d5{animation-delay:.16s}.d6{animation-delay:.2s}
.khero{grid-template-columns:repeat(6,minmax(0,1fr))}
.khero>.kh{order:-1;grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:center;padding:22px 24px !important}
.khero>.kh .kv{font-size:48px !important;letter-spacing:-1.6px !important}
.khero>:not(.kh){min-height:0 !important;padding:12px 14px !important}
.khero>:not(.kh) .kv{font-size:22px !important;letter-spacing:-.4px !important}
.brandbtn{position:relative;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:start;cursor:pointer;border-radius:12px;transition:background .2s}
.brandbtn:hover{background:#fdf6f9}
.bm-chev{position:absolute;top:2px;inset-inline-end:2px;color:#b59aa3;opacity:0;transition:transform .25s,opacity .2s}.brandbtn:hover .bm-chev,.brandbtn:focus-visible .bm-chev,.brandbtn[aria-expanded=true] .bm-chev{opacity:1}@media (hover:none){.bm-chev{opacity:.7}}
.brandbtn[aria-expanded=true] .bm-chev{transform:rotate(180deg);color:#72000d}
.bm-scrim{position:fixed;inset:0;z-index:60}
.bm-menu{position:absolute;top:calc(100% - 10px);inset-inline:0;z-index:61;background:#fff;border-radius:14px;padding:6px;box-shadow:0 18px 40px -12px rgba(52,0,6,.28),0 0 0 1px rgba(52,0,6,.06);animation:bmIn .22s cubic-bezier(.2,.8,.2,1);transform-origin:top center}
@keyframes bmIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.bm-hd{display:flex;flex-direction:column;gap:2px;padding:10px 10px 8px;margin-bottom:4px;border-bottom:1px solid #f3edef}
.bm-hd b{font:700 13px Montserrat,Inter,sans-serif;font-style:italic;color:#340006}.bm-hd span{font-size:11px;color:#8a7a80}
.bm-menu>button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;background:none;border-radius:9px;font:600 12.5px inherit;font-family:inherit;color:#47363d;cursor:pointer;text-align:start}
.bm-menu>button span{flex:1}.bm-menu>button svg{color:#9a7f89;flex:none}
.bm-menu>button:hover,.bm-menu>button:focus-visible{background:#fceef3;color:#340006}.bm-menu>button:hover svg{color:#f91495}
.bm-menu em{font:700 10px Inter,sans-serif;font-style:normal;background:#f91495;color:#fff;border-radius:999px;padding:2px 7px}
.bm-menu kbd{font:600 10px Inter,sans-serif;color:#9a8a90;background:#f6f1f3;border-radius:6px;padding:2px 6px}

.ng-edit{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:#b0a2a8;border-radius:7px;padding:3px 6px;cursor:pointer;opacity:0;transition:opacity .2s,background .2s,color .2s;font:inherit}

.ng-edit:hover{background:#fceef3;color:#72000d}

.ng-edit[data-on=true]{background:#340006;color:#fff;padding:4px 9px;letter-spacing:0}.ng-edit[data-on=true] b{font-size:11px}

/* ===== creative layer ===== */
@keyframes ecg{0%{stroke-dashoffset:34}45%{stroke-dashoffset:0}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-34;opacity:.2}}
.ecg{stroke-dasharray:34 34;animation:ecg 2.6s cubic-bezier(.5,0,.3,1) infinite}
.card,.khero>div{background-image:radial-gradient(420px circle at var(--mx,-999px) var(--my,-999px),rgba(52,0,6,.07),transparent 45%) !important}
.dark .card,.dark .khero>div{background-image:radial-gradient(420px circle at var(--mx,-999px) var(--my,-999px),rgba(95,211,198,.09),transparent 45%) !important}
@media (hover:hover){.lift{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .2s}.lift:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(61,16,31,.09) !important}.dark .lift:hover{box-shadow:0 10px 28px rgba(0,0,0,.45) !important}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vtReveal .65s cubic-bezier(.4,0,.2,1)}
@keyframes vtReveal{from{clip-path:circle(0 at var(--tx,50%) var(--ty,40px))}to{clip-path:circle(150vmax at var(--tx,50%) var(--ty,40px))}}

/* ===== presentation mode ===== */
.tour{position:fixed;left:0;right:0;bottom:22px;margin:0 auto;width:min(720px,calc(100vw - var(--navw,0px) - 32px));z-index:95;border-radius:18px;background:rgba(61,16,31,.94);color:#f5e8ec;box-shadow:0 24px 60px rgba(28,8,15,.45);backdrop-filter:blur(10px);overflow:hidden;animation:tourIn .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes tourIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.tour-body{display:flex;gap:16px;align-items:flex-start;padding:16px 18px 14px}
.tour-n{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(95,211,198,.16);color:#ff6fb5;display:grid;place-items:center;font:800 15px Inter,sans-serif}
.tour-t{font-size:16px;font-weight:800;margin:2px 0 4px;color:#fff}
.tour-x{font-size:13.5px;line-height:1.85;color:#e0c9d1;min-height:50px}
.tour-ctl{display:flex;align-items:center;gap:6px;padding:0 14px 12px}
.tour-ctl button{min-height:36px;min-width:36px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#f5e8ec;border-radius:10px;display:grid;place-items:center;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;padding:0 10px}
.tour-ctl button:hover{background:rgba(255,255,255,.12)}
.tour-dots{display:flex;gap:5px;flex:1;justify-content:center}
.tour-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .3s}
.tour-dots span[data-on="true"]{width:22px;border-radius:4px;background:#ff6fb5}
.tour-bar{height:3px;background:rgba(255,255,255,.08)}
.tour-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6fb5,#8be0d6);transform-origin:left;}
[dir=rtl] .tour-bar i{transform-origin:right}
@keyframes tpA{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes tpB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.touring main{padding-bottom:190px}
.tour-tag{position:absolute;top:14px;inset-inline-end:16px;background:#e5484d;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.5px;border-radius:999px;padding:4px 10px;display:flex;gap:7px;align-items:center;box-shadow:0 6px 16px rgba(229,72,77,.35)}
.tour-tag b{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:600px){.tour{bottom:10px}.tour-x{font-size:12.5px}.tour-n{width:36px;height:36px}}
@media (max-width:1280px){.hdr-lbl2{display:none}}
.touring{--navw:246px}.touring.navc{--navw:86px}
@media (min-width:901px){.touring .tour{inset-inline-start:var(--navw,250px);inset-inline-end:0;left:auto;right:auto;margin:0 auto}[dir=rtl].touring .tour{left:0;right:var(--navw,250px)}[dir=ltr].touring .tour{left:var(--navw,250px);right:0}}

/* ===== filter bar ===== */
.fbar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;margin-top:2px;border-top:1px solid #efece6;position:relative;z-index:31}
.flead{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#8a8273;margin-inline-end:2px}
.fdd{position:relative}
.fchip{min-height:36px;display:flex;align-items:center;gap:7px;border:1px solid #dcd7cd;background:#fff;border-radius:999px;padding:0 12px 0 14px;font-family:inherit;font-size:12px;color:#47363d;cursor:pointer;transition:all .15s}
.fchip .fk{color:#8a8273;font-weight:600}.fchip b{font-weight:800;color:#22131a;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip:hover{border-color:#340006}
.fchip[data-on=true]{background:#fceef3;border-color:#ecc3d1}.fchip[data-on=true] b{color:#340006}
.fchip[aria-expanded=true]{border-color:#340006;box-shadow:0 0 0 3px rgba(52,0,6,.12)}
.fchev{transition:transform .2s;opacity:.6}.fchip[aria-expanded=true] .fchev{transform:rotate(180deg)}
.fpop{position:absolute;top:calc(100% + 8px);inset-inline-start:0;min-width:270px;background:#fff;border-radius:14px;box-shadow:0 18px 48px rgba(61,16,31,.18),0 0 0 1px rgba(61,16,31,.06);padding:6px;z-index:40;animation:fpop .18s cubic-bezier(.2,.7,.2,1) both}
@keyframes fpop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.frow{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;border:0;background:transparent;border-radius:9px;padding:0 10px;font-family:inherit;font-size:12.5px;color:#22131a;cursor:pointer;text-align:start}
.frow:hover{background:#f6f4ef}.frow[aria-checked=true]{font-weight:700}
.fl{flex:1}.fn{font:700 11px Inter,sans-serif;color:#8a8273}
.fmini{width:46px;height:6px;border-radius:4px;background:#efece6;overflow:hidden;display:block}.fmini i{display:block}
.fsep{height:1px;background:#efece6;margin:4px 6px}
.fpreset{width:calc(100% - 8px);margin:4px 4px 6px;min-height:36px;border:1px dashed #e5484d;background:#fff6f7;color:#d42a2a;border-radius:9px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.fpreset[aria-pressed=true]{background:#e5484d;color:#fff;border-style:solid}
.freset{min-height:36px;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#d42a2a;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0 8px;border-radius:999px}
.freset:hover{background:#fdecee}
.fres{font:700 11.5px Inter,sans-serif;color:#8a7a80;padding:6px 4px;display:inline-flex;align-items:center;gap:8px}.fres::before{content:"";width:1px;height:16px;background:#e4dde0}
.fback{position:fixed;inset:0;z-index:29}
@media (max-width:900px){.fres{display:none}.fpop{min-width:240px}.fchip b{max-width:120px}.flead{display:none}}
.dark .fbar{border-color:#26181e}.dark .fchip{background:#1a1014;border-color:#382630;color:#dac3cb}.dark .fchip b{color:#f4e9ed}.dark .fchip[data-on=true]{background:#24000a;border-color:#5a1020}.dark .fchip[data-on=true] b{color:#ff6fb5}
.dark .fpop{background:#1a1014;box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 0 1px #2d1d23}.dark .frow{color:#f4e9ed}.dark .frow:hover{background:#21151a}.dark .fsep{background:#2d1d23}.dark .fmini{background:#2f1e25}
.dark .fres{color:#ad9aa1}.dark .fres::before{background:#382630}.dark .fpreset{background:#3a1a20;border-color:#ff8591;color:#ff8591}.dark .fpreset[aria-pressed=true]{background:#e5484d;color:#fff}.dark .freset:hover{background:#3a1a20}
.dark .flead{color:#ad9aa1}

/* ===== WaveTech brand ===== */
@keyframes wtGlow{0%,100%{filter:drop-shadow(0 4px 10px rgba(249,20,149,.18))}50%{filter:drop-shadow(0 4px 16px rgba(249,20,149,.45))}}
.wtm{position:relative;display:inline-flex;flex:none;isolation:isolate}
.wtm .wtmark{position:relative;z-index:1;transform-origin:20% 60%;animation:wtDraw 1.5s cubic-bezier(.65,0,.35,1) .15s backwards,wtSway 6s ease-in-out 1.8s infinite}
@keyframes wtDraw{0%{clip-path:inset(-60% 100% -60% -60%);opacity:.2;transform:translateX(-6px)}70%{opacity:1}100%{clip-path:inset(-60% -60% -60% -60%);opacity:1;transform:none}}
@keyframes wtSway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.5px) rotate(-2deg)}}
.wtm-halo{position:absolute;inset:-30% -20%;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(249,20,149,.28),transparent);animation:wtHalo 4s ease-in-out 1.2s infinite;opacity:0}
@keyframes wtHalo{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.85;transform:scale(1.08)}}
.wtm i{position:absolute;z-index:2;right:2px;top:var(--y);width:3px;height:3px;border-radius:1px;background:#f91495;opacity:0;animation:wtPix 3.2s linear calc(1.6s + var(--d)) infinite}
.wtm i:nth-child(odd){background:#ff6fb5;width:2px;height:2px}
@keyframes wtPix{0%{opacity:0;transform:translate(-6px,0)}20%{opacity:1}100%{opacity:0;transform:translate(9px,var(--dy)) scale(.5)}}
.wtword{position:relative;overflow:hidden}
.wtword::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);transform:translateX(-130%);animation:wtSheen 7s ease-in-out 1.3s infinite;pointer-events:none}
@keyframes wtSheen{0%{transform:translateX(-130%)}14%,100%{transform:translateX(130%)}}
.dark .wtword::after{background:linear-gradient(100deg,transparent 35%,rgba(255,111,181,.45) 50%,transparent 65%)}
.brandbtn:hover .wtm .wtmark{animation:wtFlick .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes wtFlick{0%{transform:none}35%{transform:translateX(3px) rotate(-6deg) scale(1.06)}70%{transform:translateX(-1px) rotate(2deg)}100%{transform:none}}
.brandbtn:hover .wtm i{animation-duration:1.1s}
.brandbtn:hover .wtm-halo{opacity:1}
@media (prefers-reduced-motion:reduce){.wtm .wtmark,.wtm-halo,.wtm i,.wtword::after{animation:none!important}.wtm i{display:none}}
.tour-n{background:rgba(249,20,149,.16) !important;color:#ff6fb5 !important}
.tour-bar i{background:linear-gradient(90deg,#f91495,#ff6fb5) !important}

[dir=ltr] .hdr.hero{background-position:right -40px top -30px !important}
.dark .hdr.hero{background-blend-mode:normal}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#8a8273;margin-top:6px}.crumb span{opacity:.5}
@media (max-width:1560px){.khero>:not(.kh) .kico{display:none}}
.cap{flex:1;height:100%;display:flex;justify-content:center}
.cap-in{width:100%;max-width:64px;height:100%;border-radius:18px;background:#f3f1ec;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:6px;box-sizing:border-box}
.cap-in span{font:800 11.5px Inter,sans-serif;color:#47363d}
.dark .cap-in{background:#21151a}.dark .cap-in span{color:#dac3cb}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:#f8f6f2}
.sfoot-ask{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:10px;padding:8px;cursor:pointer;text-align:start;font:inherit;box-shadow:0 1px 2px rgba(52,0,6,.06);transition:box-shadow .2s,transform .2s}
.sfoot-ask:hover{box-shadow:0 6px 16px -6px rgba(249,20,149,.35);transform:translateY(-1px)}
.sfoot-ic{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f91495,#72000d)}
.sfoot-t{display:flex;flex-direction:column;min-width:0}.sfoot-t b{font-size:12px;color:#340006}.sfoot-t small{font-size:10.5px;color:#8a7a80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot-sync{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 6px;font-size:10.5px;color:#47363d;font-weight:600}.sfoot-sync .live{width:7px;height:7px;border-radius:50%;background:#3ccf9c;flex:none}.sfoot-sync small{flex-basis:100%;font-weight:500;color:#9a8a90;padding-inline-start:13px}
.dark .sfoot{background:#21151a}.dark .sfoot-ask{background:#1a1014}.dark .sfoot-t b{color:#f4e9ed}.dark .sfoot-sync{color:#dac3cb}
.helpc{margin-top:auto;margin-bottom:14px;padding:16px 14px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:#dcc6cd;font-size:11px}
.helpc-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f91495,#72000d);box-shadow:0 8px 20px rgba(249,20,149,.3);margin-bottom:6px;transform:rotate(-6deg)}
.helpc strong{color:#fff;font-size:13px}
.helpc button{margin-top:8px;min-height:36px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.helpc button:hover{background:rgba(255,255,255,.08)}
.wfoot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 28px;border-top:1px solid #e4e0d8;background:#fbfaf7;font-size:11.5px;color:#6f5f66}

.wfoot-r{margin-inline-start:auto;color:#8a8273}

.helpc strong{color:#340006 !important}
.helpc button{border-color:#dcd7cd !important;color:#340006 !important;background:#fff !important}
.helpc button:hover{border-color:#340006 !important}
.helpc-ic{width:38px !important;height:38px !important;margin-bottom:2px !important}.helpc{padding:12px !important}.helpc span{display:none}

.dark nav.side .navbtn{color:#c4a9b2 !important}.dark nav.side .navbtn[aria-current=page]{background:#24000a !important;color:#ff6fb5 !important}

/* ===== Ask Wave ===== */
.wv-wrap{position:fixed;bottom:22px;inset-inline-end:22px;z-index:85;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.wv-fab{position:relative;border:0;padding:3px;border-radius:999px;background:transparent;cursor:pointer;animation:wvIn .7s cubic-bezier(.2,.9,.3,1.3) both .6s, wvFloat 4s ease-in-out infinite 1.4s;filter:drop-shadow(0 14px 28px rgba(249,20,149,.32))}
.wv-ring{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.wv-ring::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,#f91495,#340006,#ff6fb5,#f91495,#72000d,#f91495);animation:wvSpin 3.2s linear infinite}
.wv-in{position:relative;display:flex;align-items:center;gap:11px;padding:8px 18px 8px 10px;border-radius:999px;background:linear-gradient(135deg,#340006,#2a1640);color:#fff}
[dir=rtl] .wv-in{padding:8px 10px 8px 18px}
.wv-logo{position:relative;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffffff22,#ffffff08);display:grid;place-items:center;flex:none}
.wv-logo img{width:34px;height:auto;animation:wvWave 2.6s ease-in-out infinite}
.wv-logo i{position:absolute;inset:0;border-radius:50%;border:2px solid #f91495;opacity:0;animation:wvPulse 2.6s ease-out infinite}
.wv-logo i:nth-child(3){animation-delay:.85s}.wv-logo i:nth-child(4){animation-delay:1.7s}
.wv-txt{display:flex;flex-direction:column;line-height:1.25;text-align:start}
.wv-txt b{font-size:14px;font-weight:800;background:linear-gradient(90deg,#fff,#ffb3da,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wvShine 3s linear infinite}
.wv-txt small{font-size:10.5px;color:#dcb9c5;font-weight:500}
.wv-fab:hover{transform:translateY(-3px) scale(1.03);transition:transform .25s}
.wv-fab:focus-visible{outline:3px solid #f91495;outline-offset:4px}
.wv-hi{margin-bottom:6px;background:#fff;color:#340006;font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:14px;box-shadow:0 12px 30px rgba(52,0,6,.18);max-width:240px;animation:wvBubble .5s cubic-bezier(.2,.9,.3,1.3) both;position:relative}
.wv-hi::after{content:"";position:absolute;bottom:-6px;inset-inline-end:22px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
.wv-av{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}.wv-av img{width:32px;height:auto;animation:wvWave 2.6s ease-in-out infinite}
@keyframes wvSpin{to{transform:rotate(360deg)}}
@keyframes wvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wvIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes wvPulse{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes wvWave{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
@keyframes wvShine{to{background-position:-200% 0}}
@keyframes wvBubble{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.wfoot{padding-inline-end:220px}
.dark .wv-hi,.dark .wv-hi::after{background:#1a1014;color:#f4e9ed}
@media (max-width:700px){.wv-wrap{bottom:16px;inset-inline-end:16px}.wv-txt{display:none}.wv-in{padding:6px !important}.wv-logo{width:46px;height:46px}.wfoot{padding-inline-end:28px;padding-bottom:84px}}

/* ===== incident tickets ===== */
.tk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.tk{--hc:#340006;position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 18px 0;border-radius:18px;background:#fff;border:1px solid #ebe8f0;overflow:hidden;box-shadow:0 1px 2px rgba(52,0,6,.04);transition:transform .25s,box-shadow .25s}
.tk::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 100% 0%,rgba(249,20,149,calc(var(--heat)*.16)),transparent 60%)}
[dir=ltr] .tk::before{background:radial-gradient(120% 90% at 0% 0%,rgba(249,20,149,calc(var(--heat)*.16)),transparent 60%)}
.tk[data-sev=crit]{--hc:#b0124f;border-color:rgba(176,18,79,calc(.15 + var(--heat)*.35))}
.tk[data-sev=high]{--hc:#72000d}.tk[data-sev=med]{--hc:#340006}
.tk:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(52,0,6,.08)}
.tk-top{display:flex;align-items:center;gap:8px;font-size:11px;color:#967c85}
.tk-cat{display:flex;align-items:center;gap:5px;font-weight:600}
.tk-code{font:600 10.5px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#340006;background:#f3f2f7;border-radius:6px;padding:2px 7px;direction:ltr}
.tk-sev{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--hc)}
.tk-sev i{width:8px;height:8px;border-radius:50%;background:var(--hc);box-shadow:0 0 0 0 var(--hc)}
.tk[data-sev=crit] .tk-sev i{animation:tkPulse 1.6s infinite}
@keyframes tkPulse{0%{box-shadow:0 0 0 0 rgba(176,18,79,.5)}70%{box-shadow:0 0 0 9px rgba(176,18,79,0)}100%{box-shadow:0 0 0 0 rgba(176,18,79,0)}}
.tk-h{margin:2px 0 0;font-size:16.5px;font-weight:800;color:#340006;line-height:1.5}
.tk-d{margin:0;font-size:12.5px;color:#785b65;line-height:1.75}
.tk-viz{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:2px}
.tk-units{display:flex;gap:6px}
.tk-u{width:38px;height:28px;border-radius:9px;display:grid;place-items:center;background:#f3f2f7;color:#d3c3c8}
.tk-u[data-s=out]{color:#e0d4d8;background:repeating-linear-gradient(135deg,#f6f5f9 0 4px,#efeef4 4px 8px)}
.tk-u[data-s=low]{color:#c26a12;background:#fdf2e3}.tk-u[data-s=wait]{color:#b0124f;background:#fdecf3;animation:tkWait 1.8s ease-in-out infinite}
.tk-u[data-s=wait]:nth-child(2){animation-delay:.3s}.tk-u[data-s=wait]:nth-child(3){animation-delay:.6s}
@keyframes tkWait{50%{transform:translateY(-2px)}}
.tk-vn{font-size:11.5px;color:#785b65;font-weight:600}
.tk-meter{position:relative;flex:1;min-width:120px;height:8px;border-radius:99px;background:#f0eff5}
.tk-meter span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,#340006,var(--hc))}
[dir=rtl] .tk-meter span{background:linear-gradient(270deg,#340006,var(--hc))}
.tk-meter b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:#340006}
.tk-perf{position:relative;margin:auto -18px 0;border-top:2px dashed #e7e5ee}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:#f3f1ec}
.tk-perf::before{left:-9px}.tk-perf::after{right:-9px}
.tk-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0 16px}
.tk-clock{display:flex;flex-direction:column;line-height:1.1;min-width:84px}
.tk-clock b{font:800 22px 'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:-.5px;direction:ltr;text-align:start;color:color-mix(in srgb,#340006 calc(100% - var(--heat)*100%),#d11160)}
.tk-clock small{font-size:10.5px;color:#a28a92;font-weight:600}
.tk-link{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:#340006;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:6px 4px;border-radius:8px}
.tk-link:hover{color:#f91495}
.tk-swipe{--p:0%;position:relative;flex:1;min-width:150px;height:42px;border-radius:999px;background:linear-gradient(90deg,#340006 var(--p),#f3f2f7 var(--p));overflow:hidden;display:block;cursor:grab}
[dir=rtl] .tk-swipe{background:linear-gradient(270deg,#340006 var(--p),#f3f2f7 var(--p))}
.tk-swipe span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#967c85;pointer-events:none;background:linear-gradient(90deg,#967c85 40%,#f91495 50%,#967c85 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tkShine 2.6s linear infinite}
@keyframes tkShine{from{background-position:100% 0}to{background-position:-150% 0}}
.tk-swipe input{position:absolute;inset:0;width:100%;height:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:grab}
.tk-swipe input::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;border-radius:50%;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23f91495' stroke-width='2.6' stroke-linecap='round'><path d='M9 6l6 6-6 6'/></svg>") center/18px no-repeat;box-shadow:0 2px 8px rgba(52,0,6,.25);border:3px solid #340006}
.tk-swipe input::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #340006}
[dir=rtl] .tk-swipe input::-webkit-slider-thumb{transform:scaleX(-1)}
.tk-owner{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;color:#067a56;animation:fadeUp2 .4s both}
.tk-owner>span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#340006;color:#fff;font-weight:800;font-size:13px}
.tk-owner b{display:block;font-size:12.5px;color:#340006}.tk-owner small{font-size:11px;color:#a28a92}
.tk[data-ack=true]{opacity:.78}.tk[data-ack=true] .tk-clock b{color:#067a56}
.dark .tk{background:#1a1014;border-color:#2d1d23}.dark .tk-h{color:#f4e9ed}.dark .tk-d,.dark .tk-vn{color:#bf9faa}.dark .tk-code{background:#441f2b;color:#f4e9ed}
.dark .tk-perf{border-color:#2d1d23}.dark .tk-perf::before,.dark .tk-perf::after{background:#200d13}.dark .tk-u{background:#441f2b}.dark .tk-meter{background:#2d1d23}
.dark .tk-clock b{color:color-mix(in srgb,#f4e9ed calc(100% - var(--heat)*100%),#ff6fb5)}.dark .tk-link{color:#f4e9ed}.dark .tk-owner b{color:#f4e9ed}
.dark .tk-swipe{background:linear-gradient(90deg,#f91495 var(--p),#441f2b var(--p))}[dir=rtl].dark .tk-swipe,.dark[dir=rtl] .tk-swipe{background:linear-gradient(270deg,#f91495 var(--p),#441f2b var(--p))}
@media (max-width:600px){.tk-grid{grid-template-columns:1fr}.tk-swipe{flex-basis:100%}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  records() {
    if (this._recs) return this._recs;
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const cityRep = { riyadh: 1612, kharj: 298, diriyah: 214, majmaah: 156, shaqra: 112, dawadmi: 128, layla: 80 };
    const codes = { riyadh: 'RUH', kharj: 'KHJ', diriyah: 'DIR', majmaah: 'MJM', shaqra: 'SHQ', dawadmi: 'DWD', layla: 'LYL' };
    const typeW = [['chest', 312], ['sob', 286], ['mva', 274], ['abd', 241], ['loc', 168], ['fever', 152], ['fall', 147], ['stroke', 96], ['arrest', 62], ['minor', 862]];
    const typeTot = typeW.reduce((a, b) => a + b[1], 0);
    const pickType = () => { let x = rnd() * typeTot; for (const tw of typeW) { if (x < tw[1]) return tw[0]; x -= tw[1]; } return 'minor'; };
    const nats = ['sa', 'sa', 'sa', 'sa', 'sa', 'sa', 'sa', 'eg', 'in', 'pk', 'ye', 'ph'];
    const list = [];
    Object.keys(cityRep).forEach((ck) => { for (let i = 0; i < cityRep[ck]; i++) list.push(ck); });
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const tmp = list[i]; list[i] = list[j]; list[j] = tmp; }
    const out = list.map((ck) => {
      const x = rnd();
      const cl = x < 0.03 ? 0 : x < 0.19 ? 1 : x < 0.61 ? 2 : x < 0.88 ? 3 : 4;
      const ty = cl === 0 && rnd() < 0.6 ? 'arrest' : pickType();
      const clR = { arrest: [0, 0], chest: [1, 2], stroke: [1, 1], loc: [1, 2], sob: [1, 3], mva: [1, 3], abd: [2, 3], fever: [2, 4], fall: [2, 4], minor: [3, 4] }[ty] || [0, 4];
      const dx = rnd(), dKey = ty === 'arrest' ? 'tr' : dx < 0.81 ? 'tr' : dx < 0.85 ? 'ref' : 'tos';
      const sx = rnd(), sKey = sx < 0.86 ? 'done' : sx < 0.94 ? 'draft' : 'amend';
      const comp = Math.min(100, sKey === 'draft' ? 60 + Math.floor(rnd() * 25) : 84 + Math.floor(rnd() * 17));
      const day = 1 + Math.floor(rnd() * 18), hh0 = Math.floor(rnd() * 24), hh = day === 18 ? hh0 % 8 : hh0, mm = Math.floor(rnd() * 60);
      return { ck, cl: Math.min(clR[1], Math.max(clR[0], cl)), ty, dKey, sKey, comp, day, hh, mm, age: 1 + Math.floor(rnd() * 88), sex: rnd() < 0.62 ? 0 : 1, nat: nats[Math.floor(rnd() * nats.length)], seed: 1 + Math.floor(rnd() * 2147483000) };
    });
    out.sort((a, b) => (b.day * 1440 + b.hh * 60 + b.mm) - (a.day * 1440 + a.hh * 60 + a.mm));
    const n = out.length;
    out.forEach((r, i) => {
      r.id = 'PCR-' + codes[r.ck] + '-2026-' + String(482 + n - i).padStart(6, '0');
      r.dt = '2026-11-' + String(r.day).padStart(2, '0') + ' ' + String(r.hh).padStart(2, '0') + ':' + String(r.mm).padStart(2, '0');
    });
    this._recs = out;
    return out;
  }

    const s = text.toLowerCase();
    const has = (arr) => arr.some((w) => s.indexOf(w.toLowerCase()) >= 0);
    if (has(['الخرج', 'kharj', 'ليل', 'night', 'لماذا', 'ليش', 'why'])) return 'kharj';
    if (has(['إنعاش', 'توقف', 'cpr', 'arrest', 'مسار', 'pathway', 'بقاء', 'survival'])) return 'path';
    if (has(['فرز', 'دقة', 'triage', 'accura', 'تطابق'])) return 'conc';
    if (has(['تسليم', 'مستشفى', 'handover', 'hospital', 'offload'])) return 'hand';
    if (has(['توثيق', 'جودة', 'epcr', 'quality', 'ناقص', 'missing', 'rosc'])) return 'quality';
    if (has(['جاهز', 'مراكز', 'مركز', 'ready', 'fleet', 'أسطول', 'مركب', 'vehicle'])) return 'ready';
    if (has(['ctas', 'استجابة', 'response', 'زمن', 'time'])) return 'resp';
    return 'fallback';
  }

  ask(qid, rawText) {
    clearTimeout(this.typeT); clearInterval(this.streamT);
    const msgs = this.state.msgs.slice();
    msgs.push({ role: 'user', qid: rawText ? null : qid, text: rawText || null });
    this.setState({ msgs, typing: true, chatOpen: true, streaming: false, draft: '' });
    this.typeT = setTimeout(() => {
      const m2 = this.state.msgs.slice();
      m2.push({ role: 'ai', qid });
      this.setState({ msgs: m2, typing: false, streaming: this.motionOn(), streamLen: 0 });
      if (!this.motionOn()) return;
      this.streamT = setInterval(() => {
        const full = this.answers()[qid][this.state.lang].a.length;
        const n = this.state.streamLen + 4;
        if (n >= full) { clearInterval(this.streamT); this.setState({ streamLen: full, streaming: false }); }
        else this.setState({ streamLen: n });
      }, 20);
    }, this.motionOn() ? 950 : 0);
  }

  send() {
    const txt = (this.state.draft || '').trim();
    if (!txt) return;
    this.ask(this.matchQ(txt), txt);
  }
