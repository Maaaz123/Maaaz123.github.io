<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحدث الكبير — شاشة المنسق</title>
<style>
/* Tablet frame around the coordinator app (app.html).
   Desktop: the app runs at iPad size (1024×768) inside a device bezel, scaled to fit the window.
   Real tablets / small windows: no frame, the app fills the screen. */
:root{
  --screen-w:1024px; --screen-h:768px; --bezel:22px;
  --device-w:calc(var(--screen-w) + 2 * var(--bezel));
  --device-h:calc(var(--screen-h) + 2 * var(--bezel));
  --scale:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#E6E9EE;overflow:hidden;display:grid;place-items:center}

.stage{direction:ltr;width:calc(var(--device-w) * var(--scale));height:calc(var(--device-h) * var(--scale))}
.device{
  width:var(--device-w);height:var(--device-h);
  transform:scale(var(--scale));transform-origin:top left;
  position:relative;padding:var(--bezel);
  background:#1B1E23;border-radius:46px;
  box-shadow:0 0 0 2px #3A3F47, 0 30px 60px rgba(16,24,40,.22), 0 8px 18px rgba(16,24,40,.12);
}
.device::before{ /* front camera, top edge in landscape */
  content:"";position:absolute;top:8px;left:50%;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:#2C313A;box-shadow:inset 0 0 0 1.5px #111;
}
.screen{width:var(--screen-w);height:var(--screen-h);border-radius:24px;overflow:hidden;background:#EEF1F6}
.screen iframe{display:block;width:100%;height:100%;border:0}

/* tablets and small windows: drop the frame */
@media (max-width:1180px), (max-height:700px), (pointer:coarse){
  body{display:block}
  .stage,.device,.screen{width:100vw;height:100vh;transform:none;padding:0;border-radius:0;box-shadow:none;background:none}
  .device::before{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="screen"><iframe id="app" title="شاشة المنسق"></iframe></div>
  </div>
</div>
<script>
// fit the device inside the window with a margin; never enlarge beyond real size
const root = document.documentElement;
function fit(){
  const cs = getComputedStyle(root);
  const w = parseFloat(cs.getPropertyValue('--screen-w')) + 2 * parseFloat(cs.getPropertyValue('--bezel'));
  const h = parseFloat(cs.getPropertyValue('--screen-h')) + 2 * parseFloat(cs.getPropertyValue('--bezel'));
  const s = Math.min(1, (innerWidth - 64) / w, (innerHeight - 64) / h);
  root.style.setProperty('--scale', s.toFixed(4));
}
// always load the latest app.html (the browser may keep an old copy of the framed page)
document.getElementById('app').src = 'app.html?t=' + Date.now() + location.hash;
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
