<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveTech EMS Intelligence · القصة</title>
<meta name="description" content="WaveTech EMS Intelligence: طبقة تحليلية فوق Wave، من البلاغ حتى التسليم في المستشفى.">
<meta property="og:title" content="WaveTech EMS Intelligence · القصة">
<meta property="og:description" content="من البلاغ إلى المستشفى، كل دقيقة محسوبة.">
<meta property="og:image" content="https://maazmajid.com/ems/story/img/cmd.jpg">
<meta name="theme-color" content="#1C0509">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A0F17;--soft:#5C4650;--mute:#8A7680;--bg:#FBF7F8;--mint:#F8EBF0;--line:#EFDBE3;--g:#A3164F;--g2:#F91495;--gd:#72000D;--gold:#F91495;--dark:#1C0509;--e:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.64,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dark);overflow:hidden}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;transition:background .9s var(--e);background:var(--bg);overflow:hidden}
body[data-tone=mint] .sky{background:var(--mint)} body[data-tone=dark] .sky{background:var(--dark)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;transition:background 1s var(--e)}
.sky i:nth-child(1){width:46vw;height:46vw;top:-14vw;right:-10vw;background:#F6C9DC;animation:drift 22s ease-in-out infinite}
.sky i:nth-child(2){width:38vw;height:38vw;bottom:-16vw;left:-8vw;background:#FFD9EC;animation:drift 26s ease-in-out -8s infinite reverse}
.sky i:nth-child(3){width:28vw;height:28vw;top:30%;left:34%;background:#F3D3DF;opacity:.35;animation:drift 30s ease-in-out -14s infinite}
body[data-tone=dark] .sky i:nth-child(1){background:#5A0A1E} body[data-tone=dark] .sky i:nth-child(2){background:#4A0630} body[data-tone=dark] .sky i:nth-child(3){background:#3A0712}
.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(52,0,6,.07) 1px,transparent 1.4px);background-size:26px 26px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
body[data-tone=dark] .sky:after{background-image:radial-gradient(rgba(255,220,235,.06) 1px,transparent 1.4px)}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,3vw) scale(1.08)}66%{transform:translate(-3vw,2vw) scale(.95)}}
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;padding:8vh 6vw 12vh;display:grid;align-content:center;visibility:hidden;opacity:0;transform:scale(.985);filter:blur(6px);transition:opacity .7s var(--e),transform .9s var(--e),filter .7s var(--e),visibility 0s .9s}
.slide.on{visibility:visible;opacity:1;transform:none;filter:none;transition:opacity .7s var(--e) .12s,transform .9s var(--e) .12s,filter .7s var(--e) .12s,visibility 0s}
.slide.out-back{transform:translateX(-3%) scale(.985)} .slide.out-fwd{transform:translateX(3%) scale(.985)}
.dark{color:#F8EAF0}
/* type */
h1,h2,h3,p{margin:0}
.eye{font-size:clamp(14px,1.5vw,22px);font-weight:600;color:var(--g);letter-spacing:.01em}
.dark .eye{color:var(--gold)}
h2{font-size:clamp(28px,3.6vw,58px);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.lede{font-size:clamp(16px,1.6vw,25px);line-height:1.75;color:var(--soft)}
.dark .lede{color:#E2C3CF}
.tag{display:inline-block;justify-self:start;font-size:clamp(12px,1.1vw,16px);font-weight:600;color:var(--gd);background:#FCE3EE;padding:5px 14px;border-radius:999px}
.dark .tag{background:var(--gold);color:#fff}
.head{display:grid;gap:1.4vh;margin-bottom:5vh;max-width:70vw}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px} .ic.lg{width:40px;height:40px;color:var(--g);padding:10px;box-sizing:content-box;background:#FCE6EF;border-radius:16px}
.dark .ic.lg{background:#4A0B1C;color:var(--gold)}
/* reveal */
.slide:not(.on) .r,.slide:not(.on) .flip,.slide:not(.on) .pop,.slide:not(.on) .chip{opacity:0}
.on .r{animation:rise .9s var(--e) both;animation-delay:calc(var(--d,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* cover */
.cover{grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:5vw;align-items:center}
.cover .txt{display:grid;gap:2.2vh}
.title{font-size:clamp(54px,8.4vw,140px);line-height:1;font-weight:700;color:#FDF5F8;direction:ltr;text-align:right;letter-spacing:-.02em}
.title span{display:inline-block}
.on .title span{animation:titleIn 1.1s var(--e) both;animation-delay:calc(var(--d)*110ms)}
@keyframes titleIn{from{opacity:0;transform:translateY(40px) rotate(4deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.title span:last-child{background:linear-gradient(90deg,#FF8CC6,#F5BD02);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{width:clamp(54px,5vw,84px);height:auto}
.mark.big{width:clamp(80px,8vw,120px);margin-bottom:2vh}
.mk-bg{fill:#3A0712;stroke:#72000D;stroke-width:1.5}
.mk-line{fill:none;stroke:#FF9BCF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}
.mk-dot{fill:var(--gold);transform-origin:50px 22px;transform:scale(0)}
.on .mk-line{animation:draw 1.2s var(--e) .3s forwards} .on .mk-dot{animation:dot .6s var(--spring) 1.3s forwards,glow 2.6s ease-in-out 2s infinite}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes dot{to{transform:scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(249,20,149,0))}50%{filter:drop-shadow(0 0 8px rgba(249,20,149,.9))}}
.hint{font-size:14px;color:#A9808F} kbd{font-family:inherit;border:1px solid #5A2232;border-radius:6px;padding:1px 7px;margin-inline:2px;color:#F4D7E2}
/* browser frames */
.stage3d{position:relative;perspective:1800px}
.frame{margin:0;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(52,0,6,.06),0 40px 80px -36px rgba(52,0,6,.5);transform:rotateY(var(--ry,6deg)) rotateX(var(--rx,2deg));transform-style:preserve-3d;transition:transform .5s var(--e)}
.dark .frame{border-color:#4A1826;box-shadow:0 40px 90px -40px rgba(0,0,0,.8),0 0 0 1px rgba(255,140,198,.06)}
.frame .bar{display:flex;align-items:center;gap:6px;height:34px;padding-inline:14px;background:#F8F1F4;border-bottom:1px solid #EEDFE5;font-size:12px;color:#957C86;direction:ltr}
.frame .bar i{width:10px;height:10px;border-radius:50%;background:#E4E9E6} .frame .bar i:nth-child(1){background:#F47467} .frame .bar i:nth-child(2){background:#F5C451} .frame .bar i:nth-child(3){background:#5BC98A}
.frame .bar span{margin-inline-start:10px;background:#fff;border-radius:8px;padding:3px 12px;flex:1;max-width:60%;text-align:left}
.frame img{display:block;width:100%;height:auto}
.slide:not(.on) .stage3d .frame{opacity:0}
.on .stage3d .frame{animation:frameIn 1.3s var(--e) .25s both}
@keyframes frameIn{from{opacity:0;transform:translateX(-80px) rotateY(28deg) rotateX(6deg) scale(.92)}to{opacity:1;transform:rotateY(6deg) rotateX(2deg)}}
.float .frame{animation:frameIn 1.3s var(--e) .25s both,bob 7s ease-in-out 1.6s infinite!important}
@keyframes bob{0%,100%{transform:rotateY(6deg) rotateX(2deg) translateY(0)}50%{transform:rotateY(3deg) rotateX(1deg) translateY(-14px)}}
/* screenshot slides */
.shot{grid-template-columns:minmax(0,.82fr) minmax(0,1.38fr);gap:5vw;align-items:center}
.shot .txt{display:grid;gap:2vh;align-content:center}
.pts{list-style:none;margin:1vh 0 0;padding:0;display:grid;gap:1.3vh}
.pts li{position:relative;padding-inline-start:30px;font-size:clamp(14px,1.3vw,20px);color:var(--soft);line-height:1.6}
.dark .pts li{color:#E2C3CF}
.pts li:before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:16px;height:16px;border-radius:6px;background:var(--g);box-shadow:0 0 0 4px #FCE3EE;transform:scale(.8)}
.dark .pts li:before{background:var(--gold);box-shadow:0 0 0 4px #4A0B2C}
.slide:not(.on) .pts li{opacity:0}
.on .pts li{animation:slideIn .8s var(--e) both;animation-delay:calc(var(--d)*90ms)}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.chip{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(52,0,6,.55);font-size:clamp(12px,1.05vw,16px);font-weight:600;color:var(--gd);white-space:nowrap}
.chip .ic{color:var(--g)}
.chip.c0{top:14%;right:-3%} .chip.c1{bottom:10%;left:-3%}
.chip.alert{color:#B42318;border-color:#F8C9C3;bottom:-4%;right:30%} .chip.alert .ic{color:#D92D20}
.dark .chip{background:rgba(40,8,16,.9);border-color:#5A2232;color:#F8DCE7} .dark .chip .ic{color:var(--gold)}
.on .chip{animation:chipIn .7s var(--spring) both,hover 5s ease-in-out infinite;animation-delay:calc(var(--d)*90ms),calc(var(--d)*90ms + .8s)}
@keyframes chipIn{from{opacity:0;transform:translateY(18px) scale(.8)}to{opacity:1;transform:none}}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -8px}}
/* cards */
.grid3,.grid4{display:grid;gap:2vw;perspective:1400px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))} .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;padding:4vh 2.2vw;display:grid;gap:1.6vh;align-content:start;box-shadow:0 30px 60px -40px rgba(52,0,6,.45)}
.card h3{font-size:clamp(20px,2vw,32px);font-weight:700} .card p{font-size:clamp(14px,1.3vw,20px);line-height:1.7;color:var(--soft)}
.dark .card{background:rgba(58,10,22,.72);border-color:#5A1A2B} .dark .card h3{color:#FDF5F8} .dark .card p{color:#E2C3CF}
.on .flip{animation:flip 1s var(--e) both;animation-delay:calc(var(--d)*100ms);transform-origin:50% 0}
@keyframes flip{from{opacity:0;transform:rotateX(-70deg) translateY(30px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);transition:transform .4s var(--e)}
/* idea */
.flowmap{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5vw;align-items:center}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wires path{fill:none;stroke:#E3A9BF;stroke-width:2;stroke-dasharray:8 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.pulse{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(249,20,149,.9))}
.node{position:relative;z-index:1;background:#fff;border:1px solid var(--line);border-radius:26px;padding:4vh 2vw;display:grid;gap:1.4vh;justify-items:start;box-shadow:0 30px 60px -36px rgba(52,0,6,.45)}
.node h3{font-size:clamp(20px,2vw,30px)} .node p{font-size:clamp(14px,1.25vw,19px);line-height:1.7;color:var(--soft)}
.node.gate{border:2px solid var(--g);box-shadow:0 0 0 8px rgba(163,22,79,.1),0 30px 60px -30px rgba(52,0,6,.5)}
.gatebadge{position:absolute;top:-16px;inset-inline-end:20px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px}
.on .pop{animation:popIn .9s var(--spring) both;animation-delay:calc(var(--d)*100ms)}
.on .node.gate{animation:popIn .9s var(--spring) both,ring 3s ease-in-out 1.8s infinite;animation-delay:calc(var(--d)*100ms),1.8s}
@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:none}}
@keyframes ring{0%,100%{box-shadow:0 0 0 8px rgba(163,22,79,.1),0 30px 60px -30px rgba(52,0,6,.5)}50%{box-shadow:0 0 0 18px rgba(163,22,79,.06),0 30px 60px -30px rgba(52,0,6,.5)}}
/* journey */
.track{position:relative;padding-top:6vh}
.rail{position:absolute;top:calc(6vh + 26px);right:6%;left:6%;height:4px;border-radius:4px;background:linear-gradient(270deg,#F1C6D6,#F8ECF1)}
.runner{position:absolute;top:-8px;right:0;width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(249,20,149,.25),0 0 22px rgba(249,20,149,.9)}
.on .runner{animation:run 7.2s cubic-bezier(.6,0,.4,1) 1s infinite}
@keyframes run{0%{right:0;opacity:0}5%{opacity:1}95%{opacity:1}100%{right:calc(100% - 20px);opacity:0}}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.2vw}
.step{display:grid;justify-items:center;text-align:center;gap:1.2vh;padding:0 .4vw}
.dotn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;background:var(--g);box-shadow:0 0 0 8px var(--bg);position:relative;z-index:1}
.step .ic{width:30px;height:30px;color:var(--g);margin-top:1vh} .step b{font-size:clamp(15px,1.45vw,23px)} .step small{font-size:clamp(12px,1.05vw,16px);line-height:1.6;color:var(--soft)}
.slide:not(.on) .step{opacity:0}
.on .step{animation:rise .8s var(--e) both,lit 7.2s ease-in-out infinite;animation-delay:calc(var(--k)*120ms + 200ms),calc(var(--k)*1.15s + 1s)}
@keyframes lit{0%,4%,22%,100%{filter:none}8%,16%{filter:drop-shadow(0 0 14px rgba(249,20,149,.55))}}
/* duo */
.duo{align-content:center}
.pair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3vw;perspective:1800px}
.pair .frame{transform:none}
.slide:not(.on) .pair .frame{opacity:0}
.on .tiltR{animation:inR 1.2s var(--e) both;animation-delay:calc(var(--d)*90ms)} .on .tiltL{animation:inL 1.2s var(--e) both;animation-delay:calc(var(--d)*90ms)}
@keyframes inR{from{opacity:0;transform:rotateY(-24deg) translateX(60px)}to{opacity:1;transform:rotateY(-4deg)}}
@keyframes inL{from{opacity:0;transform:rotateY(24deg) translateX(-60px)}to{opacity:1;transform:rotateY(4deg)}}
.tiltR{transform:rotateY(-4deg)!important} .tiltL{transform:rotateY(4deg)!important}
/* gate */
.gate .center,.close .center{display:grid;justify-items:center;text-align:center;gap:3vh;position:relative;z-index:1}
.big{font-size:clamp(40px,6.4vw,110px);line-height:1.15;font-weight:700;color:#FDF5F8;max-width:16ch}
.under{background:linear-gradient(90deg,var(--gold),var(--gold)) no-repeat 100% 92%/0% 8px;padding-bottom:6px}
.on .under{animation:under 1.2s var(--e) 1s forwards}
@keyframes under{to{background-size:100% 8px}}
.gatefx{position:absolute;inset:0;overflow:hidden}
.gatefx i{position:absolute;top:-20%;width:2px;height:40%;background:linear-gradient(180deg,transparent,rgba(255,120,190,.7),transparent);left:calc(var(--x)*1%);animation:beam 4s linear infinite;animation-delay:calc(var(--x)*-.09s)}
.gatefx i:nth-child(1){--x:8}.gatefx i:nth-child(2){--x:20}.gatefx i:nth-child(3){--x:33}.gatefx i:nth-child(4){--x:46}.gatefx i:nth-child(5){--x:58}.gatefx i:nth-child(6){--x:71}.gatefx i:nth-child(7){--x:83}.gatefx i:nth-child(8){--x:94}
@keyframes beam{to{transform:translateY(320%)}}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:1vh}
.kpi{border-radius:20px;padding:2vh 1.2vw;display:grid;gap:4px;border:1px solid var(--line);background:#fff}
.kpi b{font-size:clamp(28px,3.2vw,52px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:clamp(12px,1vw,15px);color:var(--soft)}
.kpi.good{background:#E3F6EE;border-color:#BFE6D2} .kpi.good b{color:#067A56}
.kpi.bad{background:#FDECEA;border-color:#F8C9C3} .kpi.bad b{color:#B42318}
.kpi.info{background:#FCE6EF;border-color:#F1C6D6} .kpi.info b{color:#A3164F}
/* devices */
.devs{position:relative;height:62vh}
.devs .laptop{position:absolute;right:0;top:0;width:62%;transform:none}
.phone{position:absolute;margin:0;width:14%;border-radius:26px;overflow:hidden;border:6px solid #0F2A1E;box-shadow:0 40px 70px -30px rgba(52,0,6,.6);background:#0F2A1E}
.phone img{display:block;width:100%}
.p1{left:28%;top:8%;z-index:3} .p2{left:13%;top:16%;z-index:2} .p3{left:0;top:24%;z-index:1}
.slide:not(.on) .devs figure{opacity:0}
.on .laptop{animation:rise 1.1s var(--e) both;animation-delay:calc(var(--d)*90ms)}
.on .phone{animation:fan 1.1s var(--spring) both;animation-delay:calc(var(--d)*90ms)}
.p1{--rot:-4deg}.p2{--rot:-8deg}.p3{--rot:-12deg}
.phone{transform:rotate(var(--rot))}
@keyframes fan{from{opacity:0;transform:translateY(80px) rotate(0)}to{opacity:1;transform:rotate(var(--rot))}}
/* plan */
.tl{position:relative;padding-top:2vh}
.tlrail{position:absolute;top:calc(2vh + 15px);right:0;left:0;height:4px;background:#F2DEE6;border-radius:4px;overflow:hidden}
.tlrail i{position:absolute;inset:0;background:linear-gradient(270deg,var(--g),var(--gold));transform-origin:100% 50%;transform:scaleX(0)}
.on .tlrail i{animation:grow 2.2s var(--e) .5s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.tl ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2vw}
.tl li{position:relative;padding-top:56px;display:grid;gap:1.2vh}
.tl li:before{content:"";position:absolute;top:4px;inset-inline-start:0;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--g);box-sizing:border-box}
.tl li:last-child:before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 8px rgba(249,20,149,.2)}
.when{justify-self:start;font-size:clamp(12px,1vw,15px);font-weight:600;color:var(--gd);background:#FCE3EE;padding:4px 12px;border-radius:999px}
.tl b{font-size:clamp(18px,1.8vw,28px)} .tl small{font-size:clamp(13px,1.15vw,18px);line-height:1.7;color:var(--soft)}
.slide:not(.on) .tl li{opacity:0}
.on .tl li{animation:rise .8s var(--e) both;animation-delay:calc(var(--k)*420ms + 500ms)}
/* close */
.cta{display:inline-block;direction:ltr;font-size:clamp(18px,1.8vw,28px);font-weight:700;color:#fff;background:linear-gradient(90deg,#A3164F,var(--gold));padding:16px 34px;border-radius:999px;text-decoration:none;box-shadow:0 20px 50px -20px rgba(249,20,149,.7);transition:transform .3s var(--e)}
.cta:hover{transform:translateY(-3px) scale(1.03)}
.by{font-size:14px;color:#A9808F} .by a{color:#FF9BCF}
/* ai chat */
.ai{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:5vw;align-items:center}
.ai .txt{display:grid;gap:2vh}
.chat{position:relative;display:grid;gap:2vh;padding:3.4vh 2.2vw;border-radius:28px;background:linear-gradient(160deg,#FFF9FB,#F9E8EF);color:var(--ink);box-shadow:0 0 0 1px rgba(255,155,207,.25),0 50px 100px -40px rgba(0,0,0,.8),0 0 120px -30px rgba(163,22,79,.45)}
.chat:before{content:"";position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(120deg,rgba(255,155,207,.8),transparent 40%,rgba(249,20,149,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.chat .q{justify-self:start;max-width:92%;background:var(--ink);color:#FDF5F8;border-radius:18px 18px 4px 18px;padding:12px 18px;font-size:clamp(14px,1.25vw,19px);font-weight:600}
.typed{display:inline-block;white-space:nowrap;overflow:hidden;border-inline-end:2px solid var(--gold);max-width:0;vertical-align:bottom}
@keyframes type{to{max-width:40em}} @keyframes caret{50%{border-color:transparent}}
.on .typed{animation:type 2s steps(46) .5s forwards,caret .7s step-end 6,nocaret 0s 2.7s forwards}
@keyframes nocaret{to{border-color:transparent}}
.reads{display:grid;gap:8px} .reads small{font-size:13px;color:var(--mute);font-weight:600}

.tool{display:inline-flex;align-items:center;gap:6px;font-size:clamp(11px,.95vw,14px);padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--mute);transition:all .4s}
.slide:not(.on) .tool{opacity:0}
.on .tool{animation:popIn .5s var(--spring) both;animation-delay:calc(2.7s + var(--t)*90ms)}
.on .tool.use{animation:popIn .5s var(--spring) both,useIt .5s var(--e) forwards;animation-delay:calc(2.7s + var(--t)*90ms),calc(3.5s + var(--t)*350ms)}
@keyframes useIt{to{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 0 0 5px rgba(163,22,79,.15)}}
.ans{display:grid;gap:.9vh;background:#fff;border:1px solid var(--line);border-radius:18px;padding:2.2vh 1.6vw}
.ans p{font-size:clamp(13px,1.15vw,17px);line-height:1.7;color:var(--soft)} .ans b{color:var(--ink);font-size:clamp(14px,1.3vw,19px)}

.ans .li{position:relative;padding-inline-start:18px} .ans .li:before{content:"";position:absolute;inset-inline-start:2px;top:.75em;width:6px;height:6px;border-radius:50%;background:var(--g)}
.ans .src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:1vh;margin-top:.4vh}
.slide:not(.on) .ans,.slide:not(.on) .ans p,.slide:not(.on) .follow span{opacity:0}
.on .ans{animation:rise .7s var(--e) 4.2s both}
.on .ans p{animation:rise .6s var(--e) both} .on .a0{animation-delay:4.4s!important}.on .a1{animation-delay:4.8s!important}.on .a2{animation-delay:5s!important}.on .a3{animation-delay:5.2s!important}.on .a4{animation-delay:5.5s!important}.on .a5{animation-delay:5.7s!important}.on .a6{animation-delay:6.1s!important}
.follow{display:flex;flex-wrap:wrap;gap:10px}
.follow span{font-size:clamp(12px,1vw,15px);padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.on .follow .f0{animation:chipIn .6s var(--spring) 6.5s both} .on .follow .f1{animation:chipIn .6s var(--spring) 6.7s both}
/* problem / solution / value / offer */
.problem .grid4 .card{background:rgba(58,10,22,.72)}
.cost{display:flex;align-items:center;gap:12px;margin-top:4vh;font-size:clamp(15px,1.5vw,23px);font-weight:600;color:#FFD9D4;background:rgba(217,45,32,.14);border:1px solid rgba(240,120,105,.35);padding:14px 22px;border-radius:16px;justify-self:start}
.cost .ic{color:#F97066;transform:scaleY(-1)}
.ba{display:grid;gap:1.6vh}
.ba__h,.ba li{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1.25fr);align-items:center;gap:1vw}
.ba__h{margin:0;font-size:clamp(13px,1.1vw,16px);font-weight:700;color:var(--mute)} .ba__h span:last-child{color:var(--g)}
.ba ol{list-style:none;margin:0;padding:0;display:grid;gap:2.2vh}
.was{font-size:clamp(14px,1.35vw,21px);color:#8A6A66;background:#FBEDEB;border:1px solid #F4D3CE;border-radius:16px;padding:2.4vh 1.4vw;text-decoration:line-through 2px;text-decoration-color:transparent}
.now{display:flex;align-items:center;gap:12px;font-size:clamp(14px,1.35vw,21px);font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;padding:2.4vh 1.4vw;box-shadow:0 20px 40px -30px rgba(52,0,6,.5)} .now .ic{color:var(--g);width:22px;height:22px}
.arrow{height:3px;background:linear-gradient(270deg,#E9B4AE,var(--g));border-radius:3px;position:relative;transform-origin:100% 50%}
.arrow:after{content:"";position:absolute;left:-2px;top:50%;width:12px;height:12px;border-left:3px solid var(--g);border-bottom:3px solid var(--g);transform:translateY(-50%) rotate(45deg)}
.slide:not(.on) .ba li>*{opacity:0}
.on .ba .was{animation:rise .7s var(--e) both,strike .5s var(--e) forwards;animation-delay:calc(var(--k)*600ms + 300ms),calc(var(--k)*600ms + 900ms)}
.on .ba .arrow{animation:arrowIn .5s var(--e) both;animation-delay:calc(var(--k)*600ms + 800ms)}
.on .ba .now{animation:popIn .7s var(--spring) both;animation-delay:calc(var(--k)*600ms + 1100ms)}
@keyframes arrowIn{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes strike{to{text-decoration-color:#D9827A;color:#A88480}}
.val ul{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh}
.val li{position:relative;padding-inline-start:26px;font-size:clamp(14px,1.25vw,19px);line-height:1.65;color:var(--soft)}
.val li:before{content:"";position:absolute;inset-inline-start:0;top:.5em;width:14px;height:14px;border-radius:50%;background:#FCE3EE;box-shadow:inset 0 0 0 4px var(--g)}
.band{display:flex;align-items:center;gap:12px;justify-self:center;margin-top:4vh;font-size:clamp(16px,1.6vw,25px);font-weight:700;color:#fff;background:linear-gradient(90deg,var(--gd),var(--g));padding:14px 28px;border-radius:999px;box-shadow:0 24px 50px -24px rgba(114,0,13,.8)}
.band .ic{color:var(--gold)}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.2vw}
.tile{display:grid;gap:8px;align-content:start;background:#fff;border:1px solid var(--line);border-radius:20px;padding:2.6vh 1.2vw;box-shadow:0 24px 50px -36px rgba(52,0,6,.5);transition:transform .3s var(--e)}
.tile:hover{transform:translateY(-4px)}
.tile .ic{width:30px;height:30px;color:var(--g);padding:9px;box-sizing:content-box;background:#FCE6EF;border-radius:12px}
.tile b{font-size:clamp(15px,1.4vw,21px)} .tile small{font-size:clamp(12px,1.05vw,16px);color:var(--soft);line-height:1.5}
.slide:not(.on) .tile{opacity:0}
.on .tile{animation:popIn .7s var(--spring) both;animation-delay:calc(var(--d)*80ms)}
.on .tile:nth-child(8){animation:popIn .7s var(--spring) both,ring 3s ease-in-out 2s infinite;animation-delay:calc(var(--d)*80ms),2s;border-color:#F4B2AB}
.tile:nth-child(8) .ic{color:#D92D20;background:#FDECEA}
.chip.live{color:#067647}.dotlive{width:9px;height:9px;border-radius:50%;background:#17B26A;box-shadow:0 0 0 0 rgba(23,178,106,.5);animation:livep 1.8s ease-out infinite}
@keyframes livep{70%,100%{box-shadow:0 0 0 8px rgba(23,178,106,0)}}
/* chrome */
.progress{position:fixed;top:0;right:0;left:0;height:3px;z-index:10;background:rgba(200,120,150,.18)}
.progress i{position:absolute;inset-block:0;right:0;background:linear-gradient(270deg,var(--g),var(--gold));transition:width .8s var(--e)}
.ctrl{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border:1px solid rgba(239,219,227,.9);box-shadow:0 14px 40px -18px rgba(52,0,6,.45)}
body[data-tone=dark] .ctrl{background:rgba(40,8,16,.8);border-color:#4A1826}
.ctrl button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gd);transition:background .2s}
.ctrl button:hover{background:rgba(163,22,79,.12)} .ctrl button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
body[data-tone=dark] .ctrl button{color:#F8DCE7}
.ctrl .count{min-width:70px;text-align:center;font-size:14px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums;direction:ltr}
body[data-tone=dark] .ctrl .count{color:#D7AFBF}
.brand{position:fixed;top:18px;right:24px;z-index:10;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--gd);text-decoration:none}
body[data-tone=dark] .brand{color:#F8DCE7}
.brand svg{width:30px;height:30px}
.brand img.wt{height:26px;width:auto}
.wtlogo{width:clamp(120px,12vw,200px);height:auto;display:block}
.wtlogo.big{width:clamp(170px,17vw,280px);margin-bottom:2vh}
.on .wtlogo{animation:wtIn 1.2s var(--e) .2s both,wtGlow 3.2s ease-in-out 1.6s infinite}
@keyframes wtIn{from{opacity:0;clip-path:inset(0 0 0 100%);transform:translateX(30px)}to{opacity:1;clip-path:inset(0);transform:none}}
@keyframes wtGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(249,20,149,0))}50%{filter:drop-shadow(0 0 14px rgba(249,20,149,.55))}}
.title.en{direction:ltr}
.slide.cards4 .grid4 .card .num{font:700 clamp(26px,2.6vw,42px)/1 'IBM Plex Sans Arabic',sans-serif;color:var(--g)}
.dark .ic.lg{background:#4A0B1C;color:#FF8CC6}
.dark .eye{color:#FF8CC6}
.pulse{fill:#F91495}
/* responsive */
@media (max-width: 900px){
 .slide{padding:9vh 6vw 13vh;align-content:start;overflow-y:auto}
 .cover,.shot,.ai{grid-template-columns:1fr;gap:3vh} .typed{white-space:normal}
 .cover .stage3d,.shot .stage3d{order:2}
 .grid3,.grid4,.flowmap,.tl ol{grid-template-columns:1fr} .tiles{grid-template-columns:1fr 1fr} .ba__h{display:none} .ba li{grid-template-columns:1fr;gap:8px} .arrow{display:none}
 .steps{grid-template-columns:repeat(3,1fr);row-gap:3vh} .rail{display:none}
 .pair{grid-template-columns:1fr} .chip{display:none}
 .devs{height:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3vw} .devs .laptop{position:static;width:auto;grid-column:1/-1} .phone{position:static;width:auto;transform:none}
 .head{max-width:none} .wires{display:none} .tlrail{display:none}
}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important} .slide:not(.on) *{opacity:1!important} .mk-line{stroke-dashoffset:0} .mk-dot{transform:none} .under{background-size:100% 8px}}
</style>

<body data-tone="dark">
<div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<a class="brand" href="https://maazmajid.com/ems/" aria-label="WaveTech"><img src="img/wtmark.png" alt="" class="wt">WaveTech</a>
<main class="deck" id="deck">
<!--SLIDES-->
</main>
<nav class="ctrl" aria-label="التنقل بين الشرائح">
<button id="prev" aria-label="السابق"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
<span class="count" id="count" aria-live="polite">1 / __TOTAL__</span>
<button id="next" aria-label="التالي"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<button id="fs" aria-label="ملء الشاشة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')], N = slides.length;
  const bar = document.getElementById('bar'), count = document.getElementById('count');
  let i = 0;
  const tone = s => s.classList.contains('dark') ? 'dark' : s.classList.contains('mint') ? 'mint' : 'light';
  function countUp(s) {
    s.querySelectorAll('[data-count]').forEach(el => {
      const to = +el.dataset.count, suf = el.dataset.suf || '', t0 = performance.now(), d = 1400;
      const step = t => { const p = Math.min(1, (t - t0 - 500) / d), e = 1 - Math.pow(1 - Math.max(0, p), 3); el.textContent = Math.round(to * e) + suf; if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  function go(n, dir) {
    n = Math.max(0, Math.min(N - 1, n));
    if (n === i && slides[i].classList.contains('on')) return;
    const old = slides[i];
    old.classList.remove('on'); old.classList.add(dir > 0 ? 'out-back' : 'out-fwd');
    setTimeout(() => old.classList.remove('out-back', 'out-fwd'), 900);
    i = n; const s = slides[i];
    // restart animations
    s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
    document.body.dataset.tone = tone(s);
    bar.style.width = ((i + 1) / N * 100) + '%';
    count.textContent = (i + 1) + ' / ' + N;
    history.replaceState(null, '', '#' + (i + 1));
    countUp(s);
    const nx = slides[i + 1]; if (nx) nx.querySelectorAll('img[loading=lazy]').forEach(im => im.loading = 'eager');
  }
  const next = () => go(i + 1, 1), prev = () => go(i - 1, -1);
  document.getElementById('next').onclick = next; document.getElementById('prev').onclick = prev;
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowRight', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(0, -1); else if (e.key === 'End') go(N - 1, 1);
    else if (e.key === 'f') document.getElementById('fs').click();
  });
  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) (dx > 0 ? next : prev)(); x0 = null; });
  // gentle tilt that follows the pointer
  addEventListener('pointermove', e => {
    const f = slides[i].querySelector('.stage3d .frame'); if (!f || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const rx = (0.5 - e.clientY / innerHeight) * 6, ry = 6 + (e.clientX / innerWidth - 0.5) * 8;
    f.style.setProperty('--rx', rx.toFixed(2) + 'deg'); f.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  });
  const start = parseInt(location.hash.slice(1), 10);
  i = start >= 1 && start <= N ? start - 1 : 0;
  go(i, 1);
})();
</script>
